name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect GitHub Actions runner IP
        id: runner-ip
        shell: bash
        run: |
          set -e
          runner_ip="$(curl -fsS https://checkip.amazonaws.com || curl -fsS https://api.ipify.org)"
          runner_ip="$(echo "$runner_ip" | tr -d '[:space:]')"
          if [ -z "$runner_ip" ]; then
            echo "Failed to detect GitHub Actions runner public IP." >&2
            exit 1
          fi
          echo "cidr=$runner_ip/32" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Allow SSH from runner IP
        shell: bash
        run: |
          set -e
          set +e
          output=$(aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${{ steps.runner-ip.outputs.cidr }},Description='GitHub Actions deploy'}]" 2>&1)
          authorize_status=$?
          set -e
          if [ "$authorize_status" -ne 0 ]; then
            echo "$output"
            if echo "$output" | grep -q "InvalidPermission.Duplicate"; then
              echo "Continuing; the ingress rule already exists."
              exit 0
            fi
            exit "$authorize_status"
          fi

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          ECR_BACKEND_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -e
          docker build -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" ./backend
          docker tag "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          ECR_FRONTEND_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -e
          docker build --build-arg VITE_API_BASE_URL=/api -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" ./frontend
          docker tag "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.EC2_APP_DIR }}"
            git fetch origin
            git checkout "${{ github.ref_name }}"
            git pull origin "${{ github.ref_name }}"
            export EC2_PUBLIC_HOST="${{ secrets.EC2_HOST }}"
            export AWS_REGION="${{ secrets.AWS_REGION }}"
            export ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
            export ECR_BACKEND_REPOSITORY="${{ secrets.ECR_BACKEND_REPOSITORY }}"
            export ECR_FRONTEND_REPOSITORY="${{ secrets.ECR_FRONTEND_REPOSITORY }}"
            export IMAGE_TAG="${{ github.sha }}"
            aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.yml -f docker-compose.ec2.yml down
            docker compose -f docker-compose.yml -f docker-compose.ec2.yml pull backend frontend
            docker compose -f docker-compose.yml -f docker-compose.ec2.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.ec2.yml ps

      - name: Remove SSH access for runner IP
        if: always()
        shell: bash
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.cidr }}" \
          || echo "SSH ingress rule was already absent."
