x-awslogs-defaults: &awslogs-defaults
  driver: awslogs
  options:
    awslogs-region: ${AWS_REGION:-ap-southeast-2}
    awslogs-group: /football-results/ec2
    awslogs-create-group: "true"

services:
  mysql:
    profiles:
      - local-mysql
    ports: !override []
    logging:
      <<: *awslogs-defaults
      options:
        awslogs-region: ${AWS_REGION:-ap-southeast-2}
        awslogs-group: /football-results/ec2
        awslogs-create-group: "true"
        awslogs-stream: mysql

  backend:
    build: !reset null
    image: ${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:${IMAGE_TAG:-latest}
    depends_on: !override []
    environment:
      APP_CORS_ALLOWED_ORIGIN: http://${EC2_PUBLIC_HOST:-localhost}
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/${RDS_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports: !override []
    logging:
      <<: *awslogs-defaults
      options:
        awslogs-region: ${AWS_REGION:-ap-southeast-2}
        awslogs-group: /football-results/ec2
        awslogs-create-group: "true"
        awslogs-stream: backend

  frontend:
    build: !reset null
    image: ${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:${IMAGE_TAG:-latest}
    ports: !override
      - "80:80"
    logging:
      <<: *awslogs-defaults
      options:
        awslogs-region: ${AWS_REGION:-ap-southeast-2}
        awslogs-group: /football-results/ec2
        awslogs-create-group: "true"
        awslogs-stream: frontend
